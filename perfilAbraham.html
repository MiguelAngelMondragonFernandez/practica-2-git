<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Abraham</title>
</head>

<body style="background: linear-gradient(135deg, #e0e7ff 0%, #f0fdfa 100%); min-height: 100vh;">
    <div class="profile-card text-center" style="
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 2.5rem 2rem;
            max-width: 400px;
            margin: 40px auto;
        ">
            <img src="./assests/image1.jpeg" alt="Foto de Abraham" class="profile-img" style="
                width: 140px;
                height: 140px;
                object-fit: cover;
                border-radius: 50%;
                border: 4px solid #0d6efd;
                margin-bottom: 1.2rem;
                box-shadow: 0 4px 16px rgba(13,110,253,0.15);
            ">
            <h1 class="profile-title" style="font-weight: 700; color: #0d6efd;">Abraham Avelino Pichardo</h1>
            <p class="profile-info mb-1" style="font-size: 1.15rem; color: #333;">Nací el 5 de octubre del 2000</p>
            <div class="profile-interests" style="
                background: #e7f1ff;
                border-radius: 10px;
                padding: 1rem;
                margin-top: 1.2rem;
                font-size: 1rem;
            ">
                <strong>Mis intereses:</strong>
                <ul class="list-unstyled mb-0 mt-2" style="padding-left: 0; margin-bottom: 0; margin-top: 0.5rem;">
                    <li style="margin-bottom: 0.3rem;">🎮 Jugar videojuegos</li>
                    <li style="margin-bottom: 0.3rem;">🎵 Escuchar música</li>
                    <li>📺 Ver series</li>
                </ul>
            </div>
        </div>
</body>

</html>
